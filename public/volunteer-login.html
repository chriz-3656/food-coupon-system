<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Login</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/jpeg" href="/favicon.jpg">
    <meta property="og:title" content="Food Coupon System">
    <meta property="og:description" content="College of Engineering, Aranmula - FRESHERS DAY 2026 Food Coupon System">
    <meta property="og:image" content="https://food-coupon-system.vercel.app/social-preview.jpg">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body>
    <div class="top-header">
        <div class="college-name">College of Engineering, Aranmula</div>
        <div class="event-name">FRESHERS DAY 2026</div>
    </div>
    <nav class="brutal-nav">
        <a href="/">&larr; Home</a>
        <a href="/register">Register</a>
        <a href="/registration-status">Status</a>
        <a href="/volunteer-login">Volunteer</a>
    </nav>
    <div class="container">
        <header>
            <h1>Volunteer Login</h1>
            <p>Access the QR scanner</p>
        </header>

        <div class="card">
            <form id="login-form">
                <div class="form-group">
                    <label for="volunteer_id">Volunteer ID (e.g. V01, V02)</label>
                    <input type="text" id="volunteer_id" required placeholder="V01">
                </div>
                <div class="form-group">
                    <label for="password">Event PIN / Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn" id="submit-btn">Login</button>
            </form>
            <div id="message-box"></div>
        </div>
    </div>
    
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const msgBox = document.getElementById('message-box');
            
            btn.disabled = true;
            btn.textContent = 'Logging in...';
            msgBox.style.display = 'none';
            msgBox.className = '';

            try {
                const res = await fetch('/api/volunteer-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        volunteer_id: document.getElementById('volunteer_id').value,
                        password: document.getElementById('password').value 
                    })
                });
                const result = await res.json();

                if (result.success) {
                    window.location.href = '/verify';
                } else {
                    msgBox.textContent = result.error.message || 'Login failed.';
                    msgBox.classList.add('msg-error');
                    msgBox.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Login';
                }
            } catch (error) {
                msgBox.textContent = 'Network error.';
                msgBox.classList.add('msg-error');
                msgBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });
    </script>
    <footer class="app-footer">
        Coupon system developed by Chriz (Cyber Forensic and Information Security, 2nd year).<br>
        Instagram: <a href="https://instagram.com/chriz__3656" target="_blank">@chriz__3656</a>
    </footer>
</body>
</html>
