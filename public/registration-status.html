<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Status</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/jpeg" href="/favicon.jpg">
    <meta property="og:title" content="Food Coupon System">
    <meta property="og:description" content="College of Engineering, Aranmula - FRESHERS DAY 2026 Food Coupon System">
    <meta property="og:image" content="https://food-coupon-system.vercel.app/social-preview.jpg">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body>
    <div class="top-header">
        <div class="college-name">College of Engineering, Aranmula</div>
        <div class="event-name">FRESHERS DAY 2026</div>
    </div>
    <div class="container text-center">
        <header>
            <h1>Registration Status</h1>
        </header>

        <div class="card" id="status-card">
            <h2 id="status-text">Checking...</h2>
            <p id="status-desc" class="text-muted mt-4">Please wait...</p>
            <div id="action-area" class="mt-4"></div>
        </div>

        <div class="card" id="manual-check-card" style="display:none;">
             <h3>Check Status by Mobile Number</h3>
             <form id="check-form" class="mt-4">
                 <div class="form-group">
                     <input type="tel" id="phone_check" required placeholder="Enter Mobile Number">
                 </div>
                 <button type="submit" class="btn">Check</button>
             </form>
             <div id="check-msg" class="mt-4"></div>
        </div>
    </div>
    
    <script>
        async function checkStatusByUUID(uuid) {
            try {
                const res = await fetch(`/api/coupon?id=${uuid}`);
                const data = await res.json();
                
                const statusText = document.getElementById('status-text');
                const statusDesc = document.getElementById('status-desc');
                const actionArea = document.getElementById('action-area');
                
                if (data.success) {
                    statusText.textContent = 'Verified!';
                    statusText.style.color = 'var(--success)';
                    statusDesc.textContent = 'Your registration was approved and your coupon is ready.';
                    actionArea.innerHTML = `<a href="/coupon" class="btn btn-success">View Food Coupon</a>`;
                } else {
                    statusText.textContent = 'Pending';
                    statusText.style.color = 'var(--warning)';
                    statusDesc.textContent = 'Your registration is awaiting verification by an administrator.';
                }
            } catch (e) {
                document.getElementById('status-text').textContent = 'Error';
            }
        }

        async function checkStatusByPhone(phone) {
            try {
                const res = await fetch(`/api/registration-status?phone=${encodeURIComponent(phone)}`);
                const data = await res.json();
                const msg = document.getElementById('check-msg');
                
                if (data.success) {
                    if (data.data.status === 'VERIFIED') {
                        msg.innerHTML = `<div style="color:var(--success);font-weight:bold;">Status: Verified</div>
                        <p class="mt-4 text-muted" style="font-size:0.9em;">(Your coupon is ready. If you registered on this device, go back to the home page or click "Check Status" again if you saved your session. Otherwise, ask a volunteer for help.)</p>`;
                    } else if (data.data.status === 'REJECTED') {
                        msg.innerHTML = `<div style="color:var(--danger);font-weight:bold;">Status: Rejected</div>`;
                    } else {
                        msg.innerHTML = `<div style="color:var(--warning);font-weight:bold;">Status: Pending</div>`;
                    }
                } else {
                    msg.innerHTML = `<div style="color:var(--danger);">${data.error.message}</div>`;
                }
            } catch (e) {
                document.getElementById('check-msg').textContent = 'Error checking status.';
            }
        }

        const storedUUID = localStorage.getItem('student_uuid');
        if (storedUUID) {
            document.getElementById('manual-check-card').style.display = 'none';
            document.getElementById('status-card').style.display = 'block';
            checkStatusByUUID(storedUUID);
        } else {
            document.getElementById('status-card').style.display = 'none';
            document.getElementById('manual-check-card').style.display = 'block';
        }

        document.getElementById('check-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone_check').value;
            document.getElementById('check-msg').textContent = 'Checking...';
            checkStatusByPhone(phone);
        });
    </script>
    <footer class="app-footer">
        Coupon system developed by Chriz (Cyber Forensic and Information Security, 2nd year).<br>
        Instagram: <a href="https://instagram.com/chriz__3656" target="_blank">@chriz__3656</a>
    </footer>
</body>
</html>
