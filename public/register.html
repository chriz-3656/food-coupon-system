<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Food Coupon</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/jpeg" href="/favicon.jpg">
    <meta property="og:title" content="Food Coupon System">
    <meta property="og:description" content="College of Engineering, Aranmula - FRESHERS DAY 2026 Food Coupon System">
    <meta property="og:image" content="https://food-coupon-system.vercel.app/social-preview.jpg">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body>
    <div class="top-header">
        <div class="college-name">College of Engineering, Aranmula</div>
        <div class="event-name">FRESHERS DAY 2026</div>
    </div>
    <div class="container">
        <header>
            <h1>Student Registration</h1>
            <p>Register to receive your food coupon.</p>
        </header>

        <div class="card">
            <form id="register-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="Jane Doe">
                </div>
                <div class="form-group">
                    <label for="student_id">Roll No</label>
                    <input type="text" id="student_id" required placeholder="e.g. 123456">
                </div>
                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department" required>
                        <option value="" disabled selected>Select your department</option>
                        <optgroup label="Diploma">
                            <option value="Diploma - EC">EC</option>
                            <option value="Diploma - EEE">EEE</option>
                            <option value="Diploma - CF">CF</option>
                        </optgroup>
                        <optgroup label="B-Tech">
                            <option value="B-Tech - CS">Computer Science (CS)</option>
                            <option value="B-Tech - CIVIL">Civil</option>
                        </optgroup>
                    </select>
                </div>
                <div class="form-group">
                    <label for="year">Year</label>
                    <select id="year" required>
                        <option value="" disabled selected>Select your year</option>
                        <option value="1st">1st</option>
                        <option value="2nd">2nd</option>
                        <option value="3rd">3rd</option>
                        <option value="4th">4th</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number (Optional)</label>
                    <input type="tel" id="phone" placeholder="555-0123">
                </div>
                <button type="submit" class="btn" id="submit-btn">Register</button>
            </form>
            <div id="message-box"></div>
        </div>
        <div class="text-center mt-4">
            <a href="/registration-status">Already registered? Check status</a>
        </div>
    </div>
    
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const msgBox = document.getElementById('message-box');
            
            btn.disabled = true;
            btn.textContent = 'Registering...';
            msgBox.style.display = 'none';
            msgBox.className = '';

            const data = {
                name: document.getElementById('name').value,
                student_id: document.getElementById('student_id').value,
                department: document.getElementById('department').value,
                year: document.getElementById('year').value,
                phone: document.getElementById('phone').value
            };

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (result.success) {
                    msgBox.textContent = 'Registration successful! Redirecting...';
                    msgBox.classList.add('msg-success');
                    msgBox.style.display = 'block';
                    
                    localStorage.setItem('student_uuid', result.data.id);
                    setTimeout(() => {
                        window.location.href = `/coupon`;
                    }, 1000);
                } else {
                    msgBox.textContent = result.error.message || 'Registration failed.';
                    msgBox.classList.add('msg-error');
                    msgBox.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Register';
                }
            } catch (error) {
                msgBox.textContent = 'Network error. Please try again.';
                msgBox.classList.add('msg-error');
                msgBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Register';
            }
        });
    </script>
    <footer class="app-footer">
        Coupon system developed by Chriz (Cyber Forensic and Information Security, 2nd year).<br>
        Instagram: <a href="https://instagram.com/chriz__3656" target="_blank">@chriz__3656</a>
    </footer>
</body>
</html>
