<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Coupon</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .ticket {
            background: #fff;
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .event-name {
            font-size: 1.2rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .student-name {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 5px;
        }
        .student-id {
            font-size: 1.2rem;
            color: #475569;
            margin-bottom: 20px;
        }
        .qr-container {
            background: white;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
            margin: 20px 0;
            border: 1px solid #e2e8f0;
        }
        .coupon-code {
            font-size: 2rem;
            font-family: monospace;
            font-weight: bold;
            letter-spacing: 3px;
            background: #f1f5f9;
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .status-badge {
            display: inline-block;
            padding: 8px 24px;
            border-radius: 999px;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
        }
        .status-active { background: #dcfce7; color: #166534; }
        .status-used { background: #fef08a; color: #854d0e; }
        .status-expired { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="top-header">
        <div class="college-name">College of Engineering, Aranmula</div>
        <div class="event-name">FRESHERS DAY 2026</div>
    </div>
    <div class="container">
        <div id="loading" class="text-center mt-4">
            <h2>Loading your coupon...</h2>
        </div>
        
        <div id="error-msg" class="card hidden text-center" style="color:var(--danger)">
        </div>

        <div id="ticket-container" class="ticket hidden">
            <div class="event-name" id="c-event">Event Name</div>
            <div class="student-name" id="c-name">John Doe</div>
            <div class="student-id" id="c-sid">CS123</div>
            
            <div class="qr-container">
                <canvas id="qr-canvas"></canvas>
            </div>
            
            <div>
                <div class="coupon-code" id="c-code">XXXX-XXXX</div>
            </div>
            
            <div id="c-status" class="status-badge">STATUS</div>
            <p class="text-muted mt-4" style="font-size:0.9rem;">Present this QR code or coupon code at the food counter.</p>
        </div>

        <div id="action-buttons" class="text-center mt-4 hidden">
            <button class="btn btn-success" onclick="downloadTicket()" style="margin-bottom:10px;">Download Ticket as Image</button>
        </div>
    </div>
    
    <script>
        async function loadCoupon() {
            const uuid = localStorage.getItem('student_uuid');
            if (!uuid) {
                document.getElementById('loading').style.display = 'none';
                const err = document.getElementById('error-msg');
                err.textContent = 'No session found. Please register or ask a volunteer for help.';
                err.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch(`/api/coupon?id=${uuid}`);
                const data = await res.json();

                document.getElementById('loading').style.display = 'none';

                if (data.success) {
                    const c = data.data;
                    document.getElementById('ticket-container').classList.remove('hidden');
                    document.getElementById('action-buttons').classList.remove('hidden');
                    
                    document.getElementById('c-event').textContent = c.event_name || 'Food Distribution';
                    document.getElementById('c-name').textContent = c.student_name;
                    document.getElementById('c-sid').textContent = c.student_id;
                    document.getElementById('c-code').textContent = c.coupon_code;
                    
                    const statusEl = document.getElementById('c-status');
                    statusEl.textContent = c.status;
                    if (c.status === 'ACTIVE') statusEl.classList.add('status-active');
                    else if (c.status === 'USED') statusEl.classList.add('status-used');
                    else statusEl.classList.add('status-expired');

                    // Generate QR code with the secure token
                    const qrToken = c.coupon_token;
                    QRCode.toCanvas(document.getElementById('qr-canvas'), qrToken, {
                        width: 250,
                        margin: 1,
                        color: {
                            dark: '#0f172a',
                            light: '#ffffff'
                        }
                    });
                } else {
                    const err = document.getElementById('error-msg');
                    err.textContent = data.error.message || 'Could not load coupon.';
                    err.classList.remove('hidden');
                }
            } catch (e) {
                document.getElementById('loading').style.display = 'none';
                const err = document.getElementById('error-msg');
                err.textContent = 'Network error loading coupon.';
                err.classList.remove('hidden');
            }
        }

        async function downloadTicket() {
            const ticketElement = document.getElementById('ticket-container');
            
            // Temporary styles for a clean capture
            ticketElement.style.border = 'none';
            ticketElement.style.boxShadow = 'none';
            
            try {
                const canvas = await html2canvas(ticketElement, { scale: 2 }); // High res
                const link = document.createElement('a');
                link.download = `food_coupon_${document.getElementById('c-sid').textContent}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch(e) {
                alert('Could not download ticket. Please take a screenshot instead.');
            }
            
            // Restore styles
            ticketElement.style.border = '2px dashed #cbd5e1';
            ticketElement.style.boxShadow = '0 10px 25px rgba(0,0,0,0.05)';
        }

        loadCoupon();
    </script>
    <footer class="app-footer">
        Coupon system developed by Chriz (Cyber Forensic and Information Security, 2nd year).<br>
        Instagram: <a href="https://instagram.com/chriz__3656" target="_blank">@chriz__3656</a>
    </footer>
</body>
</html>
